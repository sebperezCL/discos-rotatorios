<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotating disc generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Print workshop: parameter panel on the left, workbench on the right */
  :root {
    --bg: #f3f5f4; --panel: #ffffff; --ink: #18201f; --muted: #5f6b69; --line: #dbe2e0;
    --accent: #0a8f96; --accent-ink: #ffffff; --warn: #a65d00; --bad: #b42318; --ok: #157a3c;
    --paper: #fbfaf7; --trace: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #151a1a; --panel: #1e2524; --ink: #e8eeed; --muted: #9aa8a6; --line: #34403e; --accent: #2bb3ba; --accent-ink: #081213; --warn: #f0a33a; --bad: #f87171; --ok: #4ade80; --paper: #262d2c; --trace: #f2f2f2; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #151a1a; --panel: #1e2524; --ink: #e8eeed; --muted: #9aa8a6; --line: #34403e; --accent: #2bb3ba; --accent-ink: #081213; --warn: #f0a33a; --bad: #f87171; --ok: #4ade80; --paper: #262d2c; --trace: #f2f2f2; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); }
  header select { width: auto; margin-left: auto; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 0; min-height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; max-height: calc(100vh - 54px); position: sticky; top: 0; }
  section.view { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0 0 12px; background: var(--panel); }
  legend { font-weight: 600; padding: 0 4px; }
  label.row { display: grid; grid-template-columns: minmax(0, 1fr) 92px; align-items: center; gap: 8px; margin: 6px 0; }
  label.row small { display: block; color: var(--muted); font-size: 12px; }
  label.check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  input[type=number], input[type=color], select { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  input[type=color] { height: 28px; padding: 1px 2px; }
  details summary { cursor: pointer; font-weight: 600; margin: 4px 0; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; background: var(--panel); margin-bottom: 12px; }
  .drop.over { border-color: var(--accent); color: var(--ink); }
  .drop img { max-width: 100%; max-height: 120px; display: block; margin: 8px auto 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; width: 100%; padding: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; justify-content: center; }
  .stage svg, .stage canvas { width: min(100%, 72vh); height: auto; aspect-ratio: 1; display: block; }
  .stage canvas.wide { aspect-ratio: auto; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0; color: var(--muted); }
  .stats b { color: var(--ink); }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  .msg.warn { border-color: var(--warn); color: var(--warn); }
  .msg.bad { border-color: var(--bad); color: var(--bad); }
  .msg.ok { border-color: var(--ok); color: var(--ok); }
  .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .sim { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .sim input[type=range] { flex: 1; min-width: 160px; }
  .help { color: var(--muted); max-width: 760px; }
  .help h3 { color: var(--ink); margin: 18px 0 6px; font-size: 15px; }
  #busy { color: var(--muted); margin: 6px 0; }
  #thumbNote { font-size: 12px; margin-top: 4px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">Rotating disc generator</h1>
  <span data-i18n="subtitle">Line illustration → 3D-printable rotating stencil disc</span>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="es">Español</option>
  </select>
</header>
<main>
  <aside>
    <div class="drop" id="drop">
      <b data-i18n="drop.title">Choose or drag an image</b><br><span data-i18n="drop.hint">Black line drawing on a white background (PNG/JPG)</span>
      <input type="file" id="file" accept="image/*" hidden>
      <img id="thumb" alt="" hidden>
      <div id="thumbNote" hidden></div>
    </div>
    <button class="primary" id="go" disabled data-i18n="go">Generate disc</button>
    <div id="busy" hidden data-i18n="busy">Generating…</div>

    <fieldset>
      <legend data-i18n="fs.disc">Disc</legend>
      <label class="row"><span data-i18n="diameter">Diameter (mm)</span><input type="number" id="diameter" value="120" step="1" min="60" max="250"></label>
      <label class="row"><span data-i18n="thickness">Disc thickness (mm)</span><input type="number" id="thickness" value="0.84" step="0.04" min="0.4"></label>
      <label class="row"><span data-i18n-html="numH">Number height (mm)<small>raised above the disc</small></span><input type="number" id="numH" value="0.32" step="0.04" min="0.12"></label>
      <label class="row"><span data-i18n="discColor">Disc color</span><input type="color" id="discColor" value="#00b1b7"></label>
      <label class="row"><span data-i18n="numColor">Number color</span><input type="color" id="numColor" value="#111111"></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="fs.drawing">Drawing</legend>
      <label class="check"><input type="checkbox" id="autoSize" checked> <span data-i18n="autoSize">Automatic size</span></label>
      <label class="row"><span data-i18n="sizeMm">Size (mm, longest side)</span><input type="number" id="sizeMm" value="50" step="1" min="10"></label>
      <label class="row"><span data-i18n-html="rMin">Free radius at the center (mm)<small>the center barely turns; best left empty</small></span><input type="number" id="rMin" value="8" step="0.5" min="0"></label>
      <label class="check"><input type="checkbox" id="autoDir" checked> <span data-i18n="autoDir">Automatic direction</span></label>
      <label class="row"><span data-i18n-html="dirDeg">Direction (°)<small>90 = drawing above the center, 270 = below</small></span><input type="number" id="dirDeg" value="90" step="15"></label>
      <label class="check"><input type="checkbox" id="autoOffset" checked> <span data-i18n="autoOffset">Automatic offset</span></label>
      <label class="row"><span data-i18n="offsetMm">Offset (mm)</span><input type="number" id="offsetMm" value="20" step="0.5"></label>
      <label class="row"><span data-i18n="threshold">Black threshold (0-255)</span><input type="number" id="threshold" value="140" step="5" min="10" max="250"></label>
      <label class="check"><input type="checkbox" id="fillToOutline" checked> <span data-i18n="fillToOutline">Fills → outline only</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="fs.slots">Slots</legend>
      <label class="row"><span data-i18n-html="slotW">Slot width (mm)<small>what the pencil draws</small></span><input type="number" id="slotW" value="1.3" step="0.05" min="0.6"></label>
      <label class="row"><span data-i18n-html="gap">Minimum bridge (mm)<small>material between slots</small></span><input type="number" id="gap" value="1.5" step="0.1" min="0.6"></label>
      <label class="row"><span data-i18n="maxLen">Maximum length per slot (mm)</span><input type="number" id="maxLen" value="30" step="1" min="5"></label>
      <label class="row"><span data-i18n-html="maxPerPos">Max. slots per number<small>0 = no limit; 1 = like Dog Man (more positions)</small></span><input type="number" id="maxPerPos" value="0" step="1" min="0"></label>
    </fieldset>

    <details>
      <summary data-i18n="advanced">Advanced</summary>
      <fieldset>
        <legend data-i18n="fs.labels">Numbers and notches</legend>
        <label class="row"><span data-i18n="labelH">Number height next to slot (mm)</span><input type="number" id="labelH" value="4" step="0.1" min="1.5"></label>
        <label class="row"><span data-i18n="rimNumH">Rim number height (mm)</span><input type="number" id="rimNumH" value="4.4" step="0.1" min="1.5"></label>
        <label class="row"><span data-i18n-html="labelStroke">Stroke width (mm)<small>about 2× the nozzle width</small></span><input type="number" id="labelStroke" value="0.9" step="0.05" min="0.3"></label>
        <label class="row"><span data-i18n-html="labelClear">Number clearance (mm)<small>extra space between a number and other slots</small></span><input type="number" id="labelClear" value="1.5" step="0.1" min="0"></label>
        <label class="row"><span data-i18n="tickLen">Notch length (mm)</span><input type="number" id="tickLen" value="2.5" step="0.1" min="0.5"></label>
        <label class="row"><span data-i18n="tickW">Notch width (mm)</span><input type="number" id="tickW" value="0.9" step="0.1" min="0.4"></label>
        <label class="check"><input type="checkbox" id="frame" checked> <span data-i18n="frame">Reference frame (position 1)</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="fs.calc">Computation</legend>
        <label class="row"><span data-i18n="angleStep">Angle step (°)</span><input type="number" id="angleStep" value="1" step="0.5" min="0.25"></label>
        <label class="row"><span data-i18n-html="minSepDeg">Min. spacing between notches (°)<small>0 = automatic</small></span><input type="number" id="minSepDeg" value="0" step="0.5" min="0"></label>
        <label class="row"><span data-i18n-html="tries">Attempts<small>more attempts = better layout, slower</small></span><input type="number" id="tries" value="9" step="1" min="1" max="60"></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="fs.print">Printing</legend>
        <label class="row"><span data-i18n="firstLayer">First layer (mm)</span><input type="number" id="firstLayer" value="0.2" step="0.02"></label>
        <label class="row"><span data-i18n="layerH">Layer height (mm)</span><input type="number" id="layerH" value="0.16" step="0.02"></label>
        <label class="row"><span data-i18n="bed">Bed size (mm)</span><input type="number" id="bed" value="256" step="1"></label>
      </fieldset>
    </details>
  </aside>

  <section class="view">
    <div class="tabs" id="tabs">
      <button data-tab="disc" class="on" data-i18n="tab.disc">Disc</button>
      <button data-tab="sim" data-i18n="tab.sim">Simulation</button>
      <button data-tab="vec" data-i18n="tab.vec">Vectorization</button>
      <button data-tab="help" data-i18n="tab.help">How to use</button>
    </div>
    <div id="messages"></div>
    <div class="stats" id="stats"></div>

    <div data-pane="disc">
      <div class="stage" id="discStage"><svg viewBox="-60 -60 120 120"><circle r="59" fill="none" stroke="currentColor" stroke-dasharray="2 2" opacity=".3"/><text y="2" text-anchor="middle" font-size="5" fill="currentColor" opacity=".5" data-i18n="placeholder">Load an image to start</text></svg></div>
      <div class="downloads">
        <button id="dl3mf" disabled data-i18n="dl.3mf">Multicolor 3MF (AMS)</button>
        <button id="dl3mfLayer" disabled data-i18n="dl.3mfLayer">3MF with filament change by layer</button>
        <button id="dlStlBody" disabled data-i18n="dl.stlBody">Disc STL</button>
        <button id="dlStlNum" disabled data-i18n="dl.stlNum">Numbers STL</button>
        <button id="dlSvg" disabled data-i18n="dl.svg">SVG</button>
        <button id="dlZip" disabled data-i18n="dl.zip">Everything in a ZIP</button>
      </div>
    </div>

    <div data-pane="sim" hidden>
      <div class="stage"><canvas id="simCanvas" width="900" height="900"></canvas></div>
      <div class="sim">
        <button id="play" data-i18n="play">▶ Play</button>
        <input type="range" id="simStep" min="0" max="0" value="0">
        <span id="simLabel"></span>
      </div>
    </div>

    <div data-pane="vec" hidden>
      <div class="stage"><canvas id="vecCanvas" class="wide" width="900" height="700"></canvas></div>
    </div>

    <div data-pane="help" hidden class="help" data-i18n-html="help"></div>
  </section>
</main>

<script src="js/i18n.js"></script>
<script src="lib/clipper.js"></script>
<script src="lib/earcut.min.js"></script>
<script src="js/vectorize.js"></script>
<script src="js/layout.js"></script>
<script src="js/geometry.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
